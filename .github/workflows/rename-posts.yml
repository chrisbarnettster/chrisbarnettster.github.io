name: Rename New Posts

on:
  push:
    branches:
      - jekyll_config 
    paths:
      - "_posts/**"

permissions:
  contents: write   # allow git push

jobs:
  rename:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions'   # prevent infinite loop
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Rename posts
        run: |
          for file in _posts/trigger-*.md; do
            [ -e "$file" ] || continue

            # Extract date (first ISO format part)
            date=$(echo "$file" | sed -E 's/.*([0-9]{4}-[0-9]{2}-[0-9]{2})T.*/\1/')
            if [ -z "$date" ]; then
              echo "❌ Could not extract date from $file"
              continue
            fi

            # Extract title (after the date part, remove extension)
            raw_title=$(basename "$file" .md | sed -E 's/.*Z-//')

            # Slugify: lowercase, transliterate, spaces -> dashes, strip symbols
            slug=$(echo "$raw_title" \
              | iconv -t ascii//TRANSLIT \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g;s/^-+|-+$//g')

            new_file="_posts/${date}-${slug}.md"

            # Avoid overwriting existing posts
            if [ -e "$new_file" ]; then
              echo "⚠️ File $new_file already exists, adding timestamp"
              new_file="_posts/${date}-${slug}-$(date +%s).md"
            fi

            echo "Renaming $file -> $new_file"
            git mv "$file" "$new_file"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _posts/*.md
          git commit -m "Auto-renamed incoming posts" || echo "No changes"
          git pull --rebase
          git push
